# Local development and CI database. Production uses the same PostgreSQL major version.
services:
  db:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botrts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botrts}
      POSTGRES_DB: ${POSTGRES_DB:-botrts}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - botrts-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Scale-out of the API tier (Phase 8.1): Socket.IO adapter and the link between API nodes and the engine node
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Logs and traces (Phase 13.2): `npm run obs:up`. One shared gateway collector that every node sends OTLP to, and a single-node
  # Elasticsearch behind it (docs/operations/DEPLOYMENT.md, "Observability"). Security is off here, for development; a deployment turns
  # it on and gives the API a read-only account.
  elasticsearch:
    profiles: [observability, stack]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '${ELASTICSEARCH_PORT:-9200}:9200'
    volumes:
      - botrts-esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200/_cluster/health | grep -qE "\"status\":\"(green|yellow)\""']
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the lifecycle policy and the index templates of the log and trace indices, then stops
  elasticsearch-init:
    profiles: [observability, stack]
    image: curlimages/curl:8.10.1
    restart: 'no'
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    volumes:
      - ./deploy/observability/elasticsearch:/init:ro
    entrypoint: ['sh', '/init/init.sh']
    depends_on:
      elasticsearch: { condition: service_healthy }

  otel-collector:
    profiles: [observability, stack]
    image: otel/opentelemetry-collector-contrib:0.120.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    # The queue directory is a fresh volume, owned by root; a deployment can give it to the image's user instead
    user: '0:0'
    environment:
      OTEL_GATEWAY_TOKEN: ${OTEL_GATEWAY_TOKEN:-botrts-dev-gateway-token}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - '${OTEL_GATEWAY_PORT:-4318}:4318'
      - '${OTEL_GATEWAY_HEALTH_PORT:-13133}:13133'
      - '${OTEL_GATEWAY_METRICS_PORT:-8888}:8888'
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - botrts-otelqueue:/var/lib/otelcol
    depends_on:
      elasticsearch-init: { condition: service_completed_successfully }

  # The whole stack (docs/operations/DEPLOYMENT.md): `docker compose --profile stack up -d --build`. The services below are not started by
  # `npm run db:up`, which only starts the database and Redis for development.
  migrate:
    profiles: [stack]
    build: { context: ., dockerfile: api/Dockerfile }
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment: &database
      DATABASE_URL: postgresql://${POSTGRES_USER:-botrts}:${POSTGRES_PASSWORD:-botrts}@db:5432/${POSTGRES_DB:-botrts}
    depends_on:
      db: { condition: service_healthy }

  # Any number of these can run behind a load balancer; they hold no game state
  api:
    profiles: [stack]
    build: { context: ., dockerfile: api/Dockerfile }
    restart: unless-stopped
    environment: &node
      <<: *database
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: redis://redis:6379
      ENGINE_ENABLED: 'true'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      WHITELIST_URLS: ${WHITELIST_URLS:-http://localhost:5173}
      ADMIN_URL: ${FRONTEND_URL:-http://localhost:5173}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_HEADERS: authorization=Bearer ${OTEL_GATEWAY_TOKEN:-botrts-dev-gateway-token}
      OTEL_GATEWAY_HEALTH_URL: http://otel-collector:13133
      OTEL_GATEWAY_METRICS_URL: http://otel-collector:8888/metrics
      TRUST_PROXY: 'true'
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/api/v1/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    command: ['node', 'ts-built/api/index.js']
    entrypoint: ['env', 'APP_ROLE=api']

  # Exactly one: it owns the game world
  engine:
    profiles: [stack]
    build: { context: ., dockerfile: api/Dockerfile }
    restart: unless-stopped
    environment: *node
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      otel-collector: { condition: service_started }
    entrypoint: ['env', 'APP_ROLE=engine']
    command: ['node', 'ts-built/api/index.js']

volumes:
  botrts-pgdata:
  botrts-esdata:
  botrts-otelqueue:

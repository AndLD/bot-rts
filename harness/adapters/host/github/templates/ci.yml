name: CI

on:
  pull_request:
    branches: [<%= branches.integration %>, <%= branches.production %>]
  push:
    branches: [<%= branches.integration %>, <%= branches.production %>]
  # Started by the workflow that updates the pull requests waiting on auto-merge, when it has no token of its own
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    # A squash merge uses the pull request title as the commit message, so it must follow the commit format of the profile
    # A run that the update workflow dispatches has no pull request event, and a skipped job left the pull request without the required check,
    # so that run reads the title of the open pull request of the branch.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check the pull request title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TITLE=$(gh pr list --head "$BRANCH" --state open --json title --jq '.[0].title // empty')
            [ -n "$TITLE" ] || { echo "No open pull request for $BRANCH: no title to check"; exit 0; }
          fi
          pattern='^(<%= commitTypes %>)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "The pull request title must be a Conventional Commit, for example 'feat(scope): add the thing'. Got: $TITLE"
            exit 1
          fi

  changes:
    # The required checks must still report, so a documentation-only change runs the workflow but skips the code jobs
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # One rule for "documentation only" in CI and in the push gate (checks.documentationPaths of the profile file); in doubt the code jobs run
      - name: Detect documentation-only changes
        id: changes
        run: node <%= harness %> ci changes "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}" "${{ github.sha }}"

  # The jobs of the stack adapter (setup, static checks, tests per package, coverage artifacts) go here, each with `needs: changes` and
  # `if: needs.changes.outputs.code == 'true'`, and the ids of those jobs are the `jobs` of this template

  verify:
    # A required check. It waits for every job above and reports green when they passed, or were skipped because the change is documentation only
    needs: [changes, <%= jobs %>]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The jobs it needs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          code=$(echo "$NEEDS" | jq -r '.changes.outputs.code')
          unexpected=$(echo "$NEEDS" | jq -r --arg code "$code" '
            to_entries[]
            | select(.value.result != (if .key == "changes" or $code == "true" then "success" else "skipped" end))
            | "\(.key) \(.value.result)"')
          if [ -n "$unexpected" ]; then
            echo "Unexpected result: $unexpected"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.code == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
      - name: Download the coverage of the shards
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: coverage-artifacts
      - name: Merge the coverage and apply the coverage gate
        if: needs.changes.outputs.code == 'true'
        run: node <%= harness %> coverage merge coverage-artifacts
      - name: Coverage report
        if: always() && needs.changes.outputs.code == 'true'
        run: |
          for pkg in $(node <%= harness %> profile get coveragePackages); do
            [ -f "$pkg/coverage/coverage-summary.json" ] || continue
            {
              echo "### Coverage ($pkg)"
              echo '```'
              node -e "const s=require('./$pkg/coverage/coverage-summary.json').total;for(const m of Object.keys(s))console.log(m.padEnd(11),s[m].pct+'%')"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Coverage of changed files (the coverage gate)
        if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        run: node <%= harness %> coverage check-changed "origin/${{ github.base_ref }}" $(node <%= harness %> profile get coveragePackages)

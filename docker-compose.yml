# Local development and CI database. Production uses the same PostgreSQL major version.
services:
  db:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botrts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botrts}
      POSTGRES_DB: ${POSTGRES_DB:-botrts}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - botrts-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Scale-out of the API tier (Phase 8.1): Socket.IO adapter and the link between API nodes and the engine node
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  botrts-pgdata:

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check that the tag matches the package version and the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$version" || { echo "package.json is not at $version"; exit 1; }
          changelog="$(node harness/tools/harness.mjs profile get paths.changelog)"
          CHANGELOG="$changelog" node -e "import('./scripts/release-lib.mjs').then(({ releaseNotes }) => process.stdout.write(releaseNotes(require('fs').readFileSync(process.env.CHANGELOG, 'utf8'), '$version')))" > release-notes.md
          test -s release-notes.md
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the API image
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]' | cut -d/ -f1)/bot-rts-api"
          docker buildx build -f api/Dockerfile --push -t "$image:$version" -t "$image:latest" .
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md

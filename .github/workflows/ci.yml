name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    # Squash merges use the PR title as the commit message, so it must be a Conventional Commit (AGENTS.md §7.4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|test|docs|chore|perf|ci)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "PR title must be a Conventional Commit, for example 'feat(engine): add the tick loop'. Got: $TITLE"
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: botrts
          POSTGRES_PASSWORD: botrts
          POSTGRES_DB: botrts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botrts -d botrts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://botrts:botrts@localhost:5432/botrts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Detect markdown-only changes
        id: changes
        # The required checks must still report, so a markdown-only change runs the job but skips the code checks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif echo "${{ github.event.before }}" | grep -qv '^0*$'; then
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            files="unknown.ts"
          fi
          if echo "$files" | grep -qv '\.md$'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci
      - name: Generate the Prisma client
        if: steps.changes.outputs.code == 'true'
        run: npm run prisma:generate -w api
      - name: API document and generated client are up to date
        if: steps.changes.outputs.code == 'true'
        run: |
          npm run openapi:generate -w api
          npm run api:generate -w client
          git diff --exit-code -- api/openapi.json client/src/shared/api/generated.ts || {
            echo "Run 'npm run openapi:generate -w api && npm run api:generate -w client' and commit the result"
            exit 1
          }
      - name: Documentation data is up to date
        if: steps.changes.outputs.code == 'true'
        run: |
          npm run docs:generate
          git diff --exit-code -- client/src/docs/generated || {
            echo "Run 'npm run docs:generate' and commit the result"
            exit 1
          }
      - name: Migrations match the Prisma schema
        if: steps.changes.outputs.code == 'true'
        env:
          PGPASSWORD: botrts
        run: |
          psql -h localhost -U botrts -d botrts -c 'CREATE DATABASE botrts_shadow'
          cd api && npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://botrts:botrts@localhost:5432/botrts_shadow --exit-code
      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: npm run lint
      - name: Import boundaries
        if: steps.changes.outputs.code == 'true'
        run: npm run check:boundaries
      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: npm run typecheck
      - name: Message catalogues
        if: steps.changes.outputs.code == 'true'
        run: npm run i18n:check
      - name: Markdown links
        run: npm run docs:check
      - name: Unit and integration tests with the 97 % coverage gate
        if: steps.changes.outputs.code == 'true'
        run: npm run test:coverage
      - name: Coverage report
        if: always() && steps.changes.outputs.code == 'true'
        run: |
          for pkg in api client; do
            [ -f "$pkg/coverage/coverage-summary.json" ] || continue
            {
              echo "### Coverage ($pkg)"
              echo '```'
              node -e "const s=require('./$pkg/coverage/coverage-summary.json').total;for(const m of ['statements','branches','functions','lines'])console.log(m.padEnd(11),s[m].pct+'%')"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Coverage of changed files (at least 97 %)
        if: steps.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        run: node scripts/check-changed-coverage.mjs "origin/${{ github.base_ref }}" api client
      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: npm run build

  e2e:
    # Cypress against a throwaway stack: fresh database, the API and the built client (scripts/e2e.mjs)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: botrts
          POSTGRES_PASSWORD: botrts
          POSTGRES_DB: botrts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botrts -d botrts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Detect markdown-only changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif echo "${{ github.event.before }}" | grep -qv '^0*$'; then
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            files="unknown.ts"
          fi
          if echo "$files" | grep -qv '\.md$'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci
      - name: Cache the Cypress binary
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: End-to-end tests
        if: steps.changes.outputs.code == 'true'
        run: npm run e2e
      - name: Keep the screenshots and server logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            client/cypress/screenshots
            .e2e/*.log
          if-no-files-found: ignore

  lighthouse:
    # The public pages are for search engines and first-time visitors: SEO at least 95 and performance at least 90 (lighthouserc.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Detect markdown-only changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif echo "${{ github.event.before }}" | grep -qv '^0*$'; then
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            files="unknown.ts"
          fi
          if echo "$files" | grep -qv '\.md$'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci
      - name: Build the client
        if: steps.changes.outputs.code == 'true'
        run: npm run build -w client
      - name: Lighthouse on the public pages
        if: steps.changes.outputs.code == 'true'
        run: |
          npm run start -w client &
          npx wait-on http://localhost:5173/ --timeout 60000
          npm run lighthouse

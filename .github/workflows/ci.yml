name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    # Squash merges use the PR title as the commit message, so it must be a Conventional Commit (AGENTS.md §7.4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|test|docs|chore|perf|ci)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "PR title must be a Conventional Commit, for example 'feat(engine): add the tick loop'. Got: $TITLE"
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: botrts
          POSTGRES_PASSWORD: botrts
          POSTGRES_DB: botrts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botrts -d botrts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://botrts:botrts@localhost:5432/botrts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Detect markdown-only changes
        id: changes
        # The required checks must still report, so a markdown-only change runs the job but skips the code checks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif echo "${{ github.event.before }}" | grep -qv '^0*$'; then
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            files="unknown.ts"
          fi
          if echo "$files" | grep -qv '\.md$'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci
      - name: Generate the Prisma client
        if: steps.changes.outputs.code == 'true'
        run: npm run prisma:generate -w api
      - name: Migrations match the Prisma schema
        if: steps.changes.outputs.code == 'true'
        env:
          PGPASSWORD: botrts
        run: |
          psql -h localhost -U botrts -d botrts -c 'CREATE DATABASE botrts_shadow'
          cd api && npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://botrts:botrts@localhost:5432/botrts_shadow --exit-code
      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: npm run lint
      - name: Import boundaries
        if: steps.changes.outputs.code == 'true'
        run: npm run check:boundaries
      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: npm run typecheck
      - name: Message catalogues
        if: steps.changes.outputs.code == 'true'
        run: npm run i18n:check
      - name: Markdown links
        run: npm run docs:check
      - name: Unit and integration tests with coverage
        if: steps.changes.outputs.code == 'true'
        run: npm run test:coverage
      - name: Coverage report
        if: always() && steps.changes.outputs.code == 'true' && hashFiles('api/coverage/coverage-summary.json') != ''
        run: |
          {
            echo '### Coverage (api)'
            echo '```'
            node -e "const s=require('./api/coverage/coverage-summary.json').total;for(const m of ['statements','branches','functions','lines'])console.log(m.padEnd(11),s[m].pct+'%')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage of changed files (at least 97 %)
        if: steps.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        run: node scripts/check-changed-coverage.mjs "origin/${{ github.base_ref }}" api
      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: npm run build

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Check that the tag matches the version file and the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./<%= versionFile %>').version")" = "$version" || { echo "<%= versionFile %> is not at $version"; exit 1; }
          node <%= harness %> release notes "$version" > release-notes.md
          test -s release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md

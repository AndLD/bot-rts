name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    # Squash merges use the PR title as the commit message, so it must be a Conventional Commit (AGENTS.md §7.4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|test|docs|chore|perf|ci)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "PR title must be a Conventional Commit, for example 'feat(engine): add the tick loop'. Got: $TITLE"
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: botrts
          POSTGRES_PASSWORD: botrts
          POSTGRES_DB: botrts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botrts -d botrts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://botrts:botrts@localhost:5432/botrts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Markdown links
        run: npm run docs:check
      - name: Unit and integration tests with coverage
        run: npm run test:coverage
      - name: Coverage report
        if: always()
        run: |
          {
            echo '### Coverage (api)'
            echo '```'
            node -e "const s=require('./api/coverage/coverage-summary.json').total;for(const m of ['statements','branches','functions','lines'])console.log(m.padEnd(11),s[m].pct+'%')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage of changed files (not blocking until Phase 1)
        if: github.event_name == 'pull_request'
        # Phase 1 removes `continue-on-error`, which makes this check blocking
        continue-on-error: true
        run: node scripts/check-changed-coverage.mjs "origin/${{ github.base_ref }}" api
      - name: Build
        run: npm run build

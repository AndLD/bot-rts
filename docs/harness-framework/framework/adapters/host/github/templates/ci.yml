name: CI

on:
  pull_request:
    branches: [<%= branches.integration %>, <%= branches.production %>]
  push:
    branches: [<%= branches.integration %>, <%= branches.production %>]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    # A squash merge uses the pull request title as the commit message, so it must follow the commit format of the profile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(<%= commitTypes %>)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "The pull request title must be a Conventional Commit, for example 'feat(scope): add the thing'. Got: $TITLE"
            exit 1
          fi

  changes:
    # The required checks must still report, so a documentation-only change runs the workflow but skips the code jobs
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # One rule for "documentation only" in CI and in the push gate (checks.documentationPaths of the profile file); in doubt the code jobs run
      - name: Detect documentation-only changes
        id: changes
        run: node harness/tools/harness.mjs ci changes "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}" "${{ github.sha }}"

  # The jobs of the stack adapter (setup, static checks, tests per package, coverage artifacts) go here, each with `needs: changes` and
  # `if: needs.changes.outputs.code == 'true'`, and the ids of those jobs are the `jobs` of this template

  verify:
    # A required check. It waits for every job above and reports green when they passed, or were skipped because the change is documentation only
    needs: [changes, <%= jobs %>]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The jobs it needs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          code=$(echo "$NEEDS" | jq -r '.changes.outputs.code')
          unexpected=$(echo "$NEEDS" | jq -r --arg code "$code" '
            to_entries[]
            | select(.value.result != (if .key == "changes" or $code == "true" then "success" else "skipped" end))
            | "\(.key) \(.value.result)"')
          if [ -n "$unexpected" ]; then
            echo "Unexpected result: $unexpected"
            exit 1
          fi
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
      - name: Download the coverage of the shards
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
      - name: Merge the coverage and apply the coverage gate
        if: needs.changes.outputs.code == 'true'
        run: node harness/tools/harness.mjs coverage merge coverage-artifacts
      - name: Coverage report
        if: always() && needs.changes.outputs.code == 'true'
        run: |
          for pkg in $(node harness/tools/harness.mjs profile get coveragePackages); do
            [ -f "$pkg/coverage/coverage-summary.json" ] || continue
            {
              echo "### Coverage ($pkg)"
              echo '```'
              node -e "const s=require('./$pkg/coverage/coverage-summary.json').total;for(const m of Object.keys(s))console.log(m.padEnd(11),s[m].pct+'%')"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Coverage of changed files (the coverage gate)
        if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        run: node harness/tools/harness.mjs coverage check-changed "origin/${{ github.base_ref }}" $(node harness/tools/harness.mjs profile get coveragePackages)
